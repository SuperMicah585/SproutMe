<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SproutMe shows</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #141816;
      --panel: #1c221f;
      --text: #e8eee9;
      --muted: #9aaba0;
      --lime: #b7f06a;
      --border: #2c3831;
      --chip: #24302a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7f5;
        --panel: #ffffff;
        --text: #1a2420;
        --muted: #5c6b62;
        --lime: #2f7a32;
        --border: #d5ddd7;
        --chip: #eef3ef;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
    }
    .shell { padding: 8px; }
    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      align-items: stretch;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .card:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }
    .thumb {
      width: 88px;
      min-height: 88px;
      background: var(--chip);
      object-fit: cover;
      display: block;
    }
    .thumb-fallback {
      width: 88px;
      min-height: 88px;
      background:
        linear-gradient(135deg, rgba(183, 240, 106, 0.18), transparent 55%),
        var(--chip);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lime);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .body {
      padding: 8px 10px 8px 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .name {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .chip {
      font-size: 11px;
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--text);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      padding: 18px 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="shell">
    <p class="title" id="title" hidden></p>
    <div class="list" id="list">
      <div class="empty">Loading shows…</div>
    </div>
  </div>
  <script>
    (function () {
      const listEl = document.getElementById("list");
      const titleEl = document.getElementById("title");

      function openUrl(url) {
        if (!url) return;
        try {
          if (window.openai && typeof window.openai.openExternal === "function") {
            window.openai.openExternal({ href: url });
            return;
          }
        } catch (_) {}
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function pickEvents(payload) {
        if (!payload) return [];
        if (Array.isArray(payload.events)) return payload.events;
        if (Array.isArray(payload.data)) return payload.data;
        if (Array.isArray(payload)) return payload;
        return [];
      }

      function render(payload) {
        const events = pickEvents(payload).filter(Boolean).slice(0, 12);
        const title = (payload && (payload.title || payload.heading)) || "";
        if (title) {
          titleEl.hidden = false;
          titleEl.textContent = title;
        } else {
          titleEl.hidden = true;
          titleEl.textContent = "";
        }

        if (!events.length) {
          listEl.innerHTML = '<div class="empty">No shows to display.</div>';
          return;
        }

        listEl.innerHTML = "";
        events.forEach((event) => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = event.detail_url || event.event_url || "#";
          card.rel = "noopener noreferrer";
          card.addEventListener("click", (e) => {
            e.preventDefault();
            openUrl(event.detail_url || event.event_url);
          });

          if (event.image_url) {
            const img = document.createElement("img");
            img.className = "thumb";
            img.src = event.image_url;
            img.alt = "";
            img.loading = "lazy";
            img.onerror = () => {
              const fallback = document.createElement("div");
              fallback.className = "thumb-fallback";
              fallback.textContent = "Show";
              img.replaceWith(fallback);
            };
            card.appendChild(img);
          } else {
            const fallback = document.createElement("div");
            fallback.className = "thumb-fallback";
            fallback.textContent = "Show";
            card.appendChild(fallback);
          }

          const body = document.createElement("div");
          body.className = "body";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = event.event_name || "Untitled show";
          body.appendChild(name);

          const metaBits = [event.date, event.venue, event.city].filter(Boolean);
          if (metaBits.length) {
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = metaBits.join(" · ");
            body.appendChild(meta);
          }

          const row = document.createElement("div");
          row.className = "row";
          const chips = [];
          if (event.ticket_info && event.ticket_info !== "N/A") chips.push(event.ticket_info);
          if (event.genre && event.genre !== "None") {
            chips.push(String(event.genre).split(/[,/;|]/)[0].trim());
          }
          chips.filter(Boolean).slice(0, 2).forEach((label) => {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = label;
            row.appendChild(chip);
          });
          if (row.childNodes.length) body.appendChild(row);

          card.appendChild(body);
          listEl.appendChild(card);
        });
      }

      function fromToolResult(params) {
        if (!params) return null;
        if (params.structuredContent) return params.structuredContent;
        if (params.result && params.result.structuredContent) {
          return params.result.structuredContent;
        }
        return params;
      }

      function syncFromHost() {
        try {
          if (window.openai && window.openai.toolOutput) {
            render(fromToolResult(window.openai.toolOutput) || window.openai.toolOutput);
            return true;
          }
        } catch (_) {}
        return false;
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-result") {
          render(fromToolResult(message.params) || {});
        }
        if (message.method === "ui/notifications/tool-input") {
          // no-op; render waits for result
        }
      }, { passive: true });

      window.addEventListener("openai:set_globals", () => {
        syncFromHost();
      });

      if (!syncFromHost()) {
        listEl.innerHTML = '<div class="empty">Waiting for shows…</div>';
      }
    })();
  </script>
</body>
</html>
