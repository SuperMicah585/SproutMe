    <!-- Immediate Theme Setup - Prevents Flash & Improves Performance -->
    <script>
      (function() {
        var isDarkMode = localStorage.getItem('darkMode') !== 'false';
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#242424';
          document.documentElement.style.color = 'rgba(255, 255, 255, 0.87)';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#ffffff';
          document.documentElement.style.color = '#213547';
        }
        
        // Prevent a one-frame theme flash, then restore transitions for hover
        var style = document.createElement('style');
        style.id = 'disable-initial-transitions';
        style.textContent = '* { transition: none !important; }';
        document.head.appendChild(style);
        window.addEventListener('DOMContentLoaded', function () {
          requestAnimationFrame(function () {
            var s = document.getElementById('disable-initial-transitions');
            if (s) s.remove();
          });
        });
      })();
    </script>
